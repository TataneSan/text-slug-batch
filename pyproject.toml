[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "text-slug-batch"
version = "1.0.0"
description = "Batch slug generator: turn lines of text into URL-safe slugs"
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
text-slug-batch = "text_slug_batch.cli:main"

[tool.setuptools.packages.find]
include = ["text_slug_batch*"]
